apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedReposv2
metadata:
  name: only-chainguard-images
spec:
  enforcementAction: scoped
  scopedEnforcementActions:
    - action: dryrun
      enforcementPoints:
        - name: validation.gatekeeper.sh
        - name: audit.gatekeeper.sh
  match:
    scope: Namespaced
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - calico-system
      - calico-apiserver
      - tigera-operator
  parameters:
    allowedImages:
      - "cgr.dev/chainguard/*"
      - "ghcr.io/goauthentik/server:2026.8.3"
      - "docker.io/library/postgres:17.11-bookworm"
      - "cloudflare/cloudflared:2026.10.0"
      - "docker.io/rancher/local-path-provisioner:v0.0.37"
      - "docker.io/library/busybox"
