# Inventory for the k8s homelab bootstrap.
# Replace the IP and user with your VM's details.
#
# ansible_user         — the SSH user (needs passwordless sudo for become)
# ansible_host         — the VM's IP or hostname
# ansible_become       — escalate to root for node-level tasks

# [k8s_nodes]
# k8s-cp-1 ansible_host=<IP or Hostname> ansible_user=<username>

# [k8s_nodes:vars]
# ansible_become=true
